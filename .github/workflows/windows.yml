      - name: 发布到 Releases（独立 Release，保留历史）
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: win-${{ github.run_number }}
          name: "ZLMediaKit Windows x64 #${{ github.run_number }}"
          target_commitish: ${{ env.BUILT_SHA }}
          body: |
            Windows x64 静态构建（历史版本全部保留，可回滚）。
            实际编译 commit: ${{ env.BUILT_SHA }}
            包内含: MediaServer.exe / config.ini / default.pem / www(如有)
          files: upload/ZLMediaKit-Windows-x64.zip
          make_latest: true

      - name: 打包二进制（Actions 产物备份）
        # ✅ 改用 shell 显式检查，彻底规避 hashFiles 在 Windows 下的兼容问题
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Recurse -File -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
            Write-Host "⚠ dist 目录为空或不存在，跳过 Artifact 上传"
            exit 0
          }
          Write-Host "✅ dist 目录下发现 $($files.Count) 个文件，准备上传 Artifact"
          # 将检查结果写入环境变量供后续步骤使用
          Add-Content -Path $env:GITHUB_ENV -Value "HAS_DIST_FILES=true"

      - name: 上传 Artifact 备份
        if: success() && env.HAS_DIST_FILES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 90
