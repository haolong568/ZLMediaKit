name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive

      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v10
        with:
          vcpkgDirectory: '${{github.workspace}}/vcpkg'
          vcpkgGitCommitId: 'efcfaaf60d7ec57a159fc3110403d939bfb69729'
          vcpkgTriplet: x64-windows-static
          appendedConfigFile: ''
          # v10 仍支持直接传参，解决无 vcpkg.json 的旧版兼容问题
          vcpkgConfigurationJsonGlob: ''
          
      - name: 安装依赖
        run: |
          ${{github.workspace}}/vcpkg/vcpkg.exe install openssl libsrtp[openssl] usrsctp --triplet x64-windows-static
        shell: pwsh

      - name: 编译
        uses: lukka/run-cmake@v10
        with:
          useVcpkgToolchainFile: true
          buildDirectory: '${{github.workspace}}/build'
          cmakeAppendedArgs: '-DCMAKE_BUILD_TYPE=Release'
          cmakeBuildType: 'Release'

      - name: 打包二进制
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          path: build/Release/*
          if-no-files-found: warn
          retention-days: 90
