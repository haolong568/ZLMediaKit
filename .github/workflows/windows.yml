name: Windows Full Build

on:
  # 🔒 防死循环：仅 Tag 和手动触发，push 到分支绝不触发 Release
  push:
    tags:
      - 'win-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      build_reason:
        description: '手动触发原因'
        required: false
        default: 'Manual full-feature build'

permissions:
  contents: write
  packages: read

env:
  VCPKG_COMMIT: efcfaaf60d7ec57a159fc3110403d939bfb69729
  VCPKG_PACKAGES: openssl libsrtp[openssl] usrsctp
  TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Record build commit SHA
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          Add-Content -Path $env:GITHUB_ENV -Value "BUILT_SHA=$sha"
          Write-Host "📌 Building commit: $sha"

      # 💾 vcpkg 缓存加速
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/packages
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Setup vcpkg & Install dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git
          }
          cd vcpkg
          git checkout $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          
          if ("${{ steps.vcpkg-cache.outputs.cache-hit }}" -ne "true") {
            Write-Host "⏳ Installing packages (no cache hit)..."
            .\vcpkg.exe install $env:VCPKG_PACKAGES.Split(' ') --triplet $env:TRIPLET
          } else {
            Write-Host "✅ vcpkg cache hit, skipping install"
          }

      - name: CMake Configure (Full Features)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ env.TRIPLET }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_WEBRTC=ON `
            -DENABLE_SRT=ON `
            -DENABLE_RTPPROXY=ON `
            -DENABLE_HLS=ON `
            -DENABLE_MP4=ON `
            -DENABLE_API=ON `
            -DENABLE_TESTS=OFF `
            -DENABLE_FAAC=OFF `
            -DENABLE_X264=OFF `
            -DENABLE_FFMPEG=OFF

      - name: Build MediaServer
        shell: pwsh
        run: |
          cmake --build build --config Release --target MediaServer --parallel 4
          if (-not (Test-Path build/server/MediaServer.exe)) {
            throw "❌ MediaServer.exe not found after build"
          }
          Write-Host "✅ Build successful"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # 1. 主程序
          Copy-Item build/server/MediaServer.exe -Destination dist/ -Force
          
          # 2. 配置文件
          $configPaths = @("server/config.ini", "conf/config.ini", "config.ini")
          foreach ($p in $configPaths) {
            if (Test-Path $p) {
              Copy-Item $p -Destination dist/config.ini -Force
              Write-Host "📄 Config: $p"
              break
            }
          }
          
          # 3. SSL 证书
          $pemSrc = Get-ChildItem -Path . -Recurse -Filter "default.pem" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -notmatch '\\(vcpkg|build|\.git)\\' } |
                    Select-Object -First 1
          
          if ($pemSrc) {
            Copy-Item $pemSrc.FullName -Destination dist/default.pem -Force
            Write-Host "🔒 Certificate: $($pemSrc.FullName)"
          } else {
            Write-Host "⚠ No default.pem found, generating self-signed..."
            $openssl = Get-ChildItem -Path vcpkg/installed -Recurse -Filter "openssl.exe" -ErrorAction SilentlyContinue |
                       Select-Object -First 1 -ExpandProperty FullName
            if ($openssl) {
              & $openssl req -x509 -newkey rsa:2048 `
                -keyout "$env:TEMP/key.pem" -out "$env:TEMP/cert.pem" `
                -days 3650 -nodes -subj "/CN=localhost"
              Get-Content "$env:TEMP/cert.pem", "$env:TEMP/key.pem" | Set-Content dist/default.pem
              Write-Host "✅ Generated self-signed certificate"
            } else {
              Write-Host "⚠ OpenSSL not found, skipping cert generation"
            }
          }
          
          # 4. Web 资源
          $wwwDir = Get-ChildItem -Path . -Directory -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -in @('www','web') -and $_.FullName -notmatch '\\(vcpkg|build|\.git)\\' } |
                    Select-Object -First 1
          if ($wwwDir) {
            Copy-Item $wwwDir.FullName -Destination dist/www -Recurse -Force
            Write-Host "🌐 Web root: $($wwwDir.FullName)"
          }
          
          Write-Host "`n=== dist contents ==="
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Compress-Archive -Path dist\* -DestinationPath upload\ZLMediaKit-Windows-x64-Full.zip -Force
          $size = [math]::Round((Get-Item upload\ZLMediaKit-Windows-x64-Full.zip).Length / 1MB, 2)
          Write-Host "📦 Package size: ${size} MB"

      # 🔑 关键修复：恢复 RELEASE_TOKEN + 增加权限预检
      - name: Validate RELEASE_TOKEN
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:GH_TOKEN)) {
            throw "❌ secrets.RELEASE_TOKEN is not configured! Please add it in Settings → Secrets → Actions"
          }
          $headers = @{ Authorization = "token $env:GH_TOKEN" }
          try {
            $repo = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}" -Headers $headers
            Write-Host "✅ Token valid for repo: $($repo.full_name)"
          } catch {
            throw "❌ RELEASE_TOKEN invalid or lacks repo access: $_"
          }

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "ZLMediaKit Windows x64 Full ($tag)"
          $body = @"
          ## ZLMediaKit Windows x64 Full Feature Build
          
          - **Commit**: ``${{ env.BUILT_SHA }}``
          - **Features**: WebRTC / SRT / HLS / RTSP / RTMP / HTTP-FLV / GB28181
          - **Dependencies**: OpenSSL + libsrtp + usrsctp (static linked)
          
          ### Contents
          - MediaServer.exe
          - config.ini
          - default.pem (self-signed if not in repo)
          - www/ (web resources if available)
          "@
          
          Write-Host "🚀 Creating release: $tag"
          gh release create $tag `
            upload/ZLMediaKit-Windows-x64-Full.zip `
            --title $title `
            --notes $body `
            --latest
          
          if ($LASTEXITCODE -ne 0) {
            throw "❌ gh release create failed with exit code $LASTEXITCODE"
          }
          Write-Host "✅ Released successfully: $tag"

      - name: Upload Artifact (for non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ZLMediaKit-Windows-x64-Full-${{ github.run_number }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
