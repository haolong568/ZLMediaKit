name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive

      - name: 安装 vcpkg 并编译依赖
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/vcpkg
          cd ${{github.workspace}}/vcpkg
          git checkout efcfaaf60d7ec57a159fc3110403d939bfb69729
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install openssl libsrtp[openssl] usrsctp --triplet x64-windows-static

      - name: CMake 配置与编译
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: 检查构建产物（调试用）
        shell: pwsh
        run: |
          Write-Host "=== 构建目录完整结构 ==="
          Get-ChildItem -Path build -Recurse -Include *.exe,*.dll,*.lib | Select-Object FullName
          Write-Host "========================"

      - name: 打包二进制
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          # ⚠️ 请先根据上一步调试日志确认实际路径，以下为旧版ZLMediaKit常见输出位置
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: error
          retention-days: 90
