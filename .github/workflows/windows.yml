name: Windows Build ZLMediaKit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      ZLM_COMMIT: 79d795a767da85bbba821b871265fd87d853d808
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ZLM_COMMIT }}
          submodules: false

      - name: 更新子模块
        run: |
          git submodule sync
          git submodule update --init --depth=1

      # 加载系统VS编译环境
      - name: 加载 VS2022 环境
        uses: ilammy/msvc-dev-cmd@v1

      # 执行ZLMediaKit官方Windows编译脚本
      - name: 执行编译
        run: |
          .\build_win.cmd

      # 整理发布包
      - name: 整理产物
        run: |
          New-Item release -ItemType Directory -Force
          Copy-Item release/* ./release/ -Recurse -Force
          Copy-Item config.ini ./release/
          Copy-Item default.pem ./release/
          Copy-Item -Recurse www ./release/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ZLMediaKit-Win-x64-${{ env.ZLM_COMMIT }}
          path: ./release
          retention-days: 30
