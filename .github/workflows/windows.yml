name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive

      - name: 安装 vcpkg 并编译依赖
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/vcpkg
          cd ${{github.workspace}}/vcpkg
          git checkout efcfaaf60d7ec57a159fc3110403d939bfb69729
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install openssl libsrtp[openssl] usrsctp --triplet x64-windows-static

      - name: CMake 配置与强制编译 MediaServer
        shell: pwsh
        run: |
          # ⚠️ 关键修复：每次运行前彻底清理 build 目录，避免缓存导致目标被跳过
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_EXAMPLES=ON `
            -DBUILD_TESTING=OFF
          
          Write-Host "=== 确认 MediaServer 目标存在 ==="
          $targetExists = cmake --build build --target help | Select-String -Pattern "^\s*MediaServer\s*$"
          if (-not $targetExists) { throw "MediaServer 目标不存在，请检查 ENABLE_EXAMPLES 是否生效" }
          
          # ⚠️ 强制重建：使用 --clean-first 确保不跳过任何步骤
          Write-Host "=== 强制重建 MediaServer ==="
          cmake --build build --config Release --target MediaServer --clean-first
          
          # 编译后立即校验
          $exeFiles = Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles.Count -eq 0) {
            Write-Host "=== 构建目录所有二进制文件（用于排查）==="
            Get-ChildItem -Path build -Recurse -Include *.exe,*.lib,*.dll,*.obj | Select-Object FullName, Length
            throw "编译完成但未找到任何 .exe 文件，请检查上方编译日志是否有静默失败"
          }
          Write-Host "✅ 已生成的可执行文件:"
          $exeFiles | ForEach-Object { Write-Host "  $($_.FullName) ($([math]::Round($_.Length/1KB, 2)) KB)" }

      - name: 收集构建产物到统一目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem -Path build -Recurse -Include *.exe,*.dll | Copy-Item -Destination dist -Force
          
          $exeCount = (Get-ChildItem dist -Filter *.exe).Count
          $dllCount = (Get-ChildItem dist -Filter *.dll).Count
          Write-Host "=== 已收集产物：$exeCount 个 exe, $dllCount 个 dll ==="
          Get-ChildItem dist | Select-Object Name, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,2)}}
          
          if ($exeCount -eq 0) { 
            throw "产物收集失败：dist 目录中无 .exe 文件" 
          }

      - name: 打包二进制
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
