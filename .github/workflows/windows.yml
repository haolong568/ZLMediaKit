name: Windows Build ZLMediaKit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      ZLM_COMMIT: 79d795a767da85bbba821b871265fd87d853d808
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ZLM_COMMIT }}
          submodules: false

      - name: 拉取子模块
        run: |
          git submodule sync
          git submodule update --init --depth=1

      - name: 加载VS2022编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 创建依赖目录并下载OpenSSL
        run: |
          mkdir build;mkdir build/openssl
          cd build/openssl
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/ZLMediaKit/ZLMediaKit/releases/download/openssl-windows/openssl-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile openssl.zip
          Expand-Archive -Path openssl.zip -DestinationPath . -Force

      - name: CMake配置
        run: |
          cmake -S . -B build `
          -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/build/openssl" `
          -DENABLE_WEBRTC=OFF `
          -G "Visual Studio 17 2022" -A x64

      - name: 编译Release
        run: cmake --build build --config Release -j4

      - name: 打包运行目录
        run: |
          New-Item release -Force -ItemType Directory
          Copy-Item build/Release/MediaServer.exe release/
          Copy-Item config.ini release/
          Copy-Item default.pem release/
          Copy-Item -Recurse www release/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ZLMediaKit-Win-x64
          path: release
