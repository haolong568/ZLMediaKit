name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 切换gitmodules文件并更新子模块
        run: |
          mv -Force .gitmodules_github .gitmodules
          git submodule sync
          git submodule update --init

      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgDirectory: '${{github.workspace}}/vcpkg'
          vcpkgTriplet: x64-windows-static
          # 替换为你指定的commit id
          vcpkgGitCommitId: 'efcfaaf60d7ec57a159fc3110403d939bfb69729'
          vcpkgArguments: 'openssl libsrtp[openssl] usrsctp'

      - name: CMake编译
        uses: lukka/run-cmake@v3
        with:
          useVcpkgToolchainFile: true
          buildDirectory: '${{github.workspace}}/build'
          cmakeAppendedArgs: ''
          cmakeBuildType: 'Release'

      - name: 设置打包环境变量
        run: |
          $dateString = Get-Date -Format "yyyy-MM-dd"
          $branch = $env:GITHUB_REF -replace "refs/heads/", "" -replace "[\\/\\?%\*:\|\`"<>]", "_"
          $branch2 = $env:GITHUB_REF -replace "refs/heads/", ""
          echo "BRANCH=$branch" >> $env:GITHUB_ENV
          echo "BRANCH2=$branch2" >> $env:GITHUB_ENV
          echo "DATE=$dateString" >> $env:GITHUB_ENV

      - name: 上传编译产物
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}_${{ env.BRANCH }}_${{ env.DATE }}
          # ⚠️关键：构建输出在build/Release，根据ZLMediaKit实际输出目录修改！
          path: build/Release/
          if-no-files-found: error
          retention-days: 90

      # ==========重要提醒==========
      # upload-artifact@v4 已经移除 artifact-url，无法直接获取下载链接！
      # 如果你必须issue自动评论下载链接，需要额外第三方action，否则注释下面这一段
      - name: issue评论
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/feature/test'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{vars.VERSION_ISSUE_NO}},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '- 产物名称: ${{ github.workflow }}_${{ env.BRANCH }}_${{ env.DATE }}\n'
                + '- 分支: ${{ env.BRANCH2 }}\n' 
                + '- git hash: ${{ github.sha }} \n' 
                + '- 编译日期: ${{ env.DATE }}\n' 
                + '- 编译记录: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n'
                + '- CI工作流: ${{ github.workflow }}\n' 
                + '- 开启特性: openssl/webrtc/datachannel\n'
                + '- 说明: x64 windows静态编译版本\n'
                + '> ⚠️前往Actions运行记录页面手动下载Artifact'
            })
