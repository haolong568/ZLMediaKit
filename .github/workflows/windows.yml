name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive

      - name: 安装 vcpkg 并编译依赖
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/vcpkg
          cd ${{github.workspace}}/vcpkg
          git checkout efcfaaf60d7ec57a159fc3110403d939bfb69729
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install openssl libsrtp[openssl] usrsctp --triplet x64-windows-static

      - name: CMake 配置与显式编译 MediaServer
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_EXAMPLES=ON `
            -DBUILD_TESTING=OFF
          
          Write-Host "=== 确认可用目标 ==="
          cmake --build build --target help | Select-String -Pattern "MediaServer"
          
          # ⚠️ 关键修复：不再使用 --parallel 全量构建，显式指定 MediaServer 目标
          Write-Host "=== 开始显式编译 MediaServer ==="
          cmake --build build --config Release --target MediaServer
          
          # 编译后立即校验，避免无效等待
          $exePath = Get-ChildItem -Path build -Recurse -Filter "MediaServer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "=== 构建目录完整结构（用于排查）==="
            Get-ChildItem -Path build -Recurse -Include *.exe,*.lib,*.dll | Select-Object FullName
            throw "编译完成但未找到 MediaServer.exe，请检查上方编译日志是否有链接错误"
          }
          Write-Host "✅ MediaServer.exe 已生成: $($exePath.FullName)"

      - name: 收集构建产物到统一目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem -Path build -Recurse -Include *.exe,*.dll | Copy-Item -Destination dist -Force
          
          $exeCount = (Get-ChildItem dist -Filter *.exe).Count
          $dllCount = (Get-ChildItem dist -Filter *.dll).Count
          Write-Host "=== 已收集产物：$exeCount 个 exe, $dllCount 个 dll ==="
          Get-ChildItem dist | Select-Object Name, Length
          
          if ($exeCount -eq 0) { 
            throw "产物收集失败：dist 目录中无 .exe 文件" 
          }

      - name: 打包二进制
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
