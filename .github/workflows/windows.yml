name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive

      - name: 安装 vcpkg 并编译依赖
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/vcpkg
          cd ${{github.workspace}}/vcpkg
          git checkout efcfaaf60d7ec57a159fc3110403d939bfb69729
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install openssl libsrtp[openssl] usrsctp --triplet x64-windows-static

      - name: CMake 配置
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release
          
          Write-Host "=== CMakeCache 输出目录相关配置 ==="
          Get-Content build/CMakeCache.txt | Select-String -Pattern "OUTPUT"

      - name: 编译 MediaServer
        shell: pwsh
        run: |
          # 关键修复：VS生成器下 --target help 不输出目标列表，改用 vcxproj 文件判断
          if (-not (Test-Path build/server/MediaServer.vcxproj)) {
            Write-Host "=== build 下所有 vcxproj（用于定位真实目标工程）==="
            Get-ChildItem -Path build -Recurse -Filter *.vcxproj | Select-Object FullName
            throw "未找到 build/server/MediaServer.vcxproj"
          }
          
          Write-Host "=== 开始编译 MediaServer ==="
          cmake --build build --config Release --target MediaServer --parallel 4

      - name: 全工作区定位并收集 MediaServer.exe
        shell: pwsh
        run: |
          # 关键修复：旧版CMake把exe输出到build之外，因此搜索整个工作区而非仅build
          Write-Host "=== 全工作区查找 MediaServer.exe ==="
          $found = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "MediaServer.exe" -ErrorAction SilentlyContinue
          
          if (-not $found) {
            Write-Host "=== 未找到，列出工作区所有非vcpkg的exe ==="
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\vcpkg\\' } |
              Select-Object FullName
            throw "整个工作区未找到 MediaServer.exe"
          }
          
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($f in @($found)) {
            Write-Host "收集: $($f.FullName) ($([math]::Round($f.Length/1KB,2)) KB)"
            Copy-Item $f.FullName -Destination dist -Force
            # 同目录下的 dll 一并收集（如有）
            Get-ChildItem -Path $f.DirectoryName -Filter *.dll | Copy-Item -Destination dist -Force
          }
          
          # 尽力附带配置文件
          @("server/config.ini", "conf/config.ini", "config.ini") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ -Destination dist -Force; Write-Host "收集配置: $_" }
          }
          
          Write-Host "=== dist 最终内容 ==="
          Get-ChildItem dist | Select-Object Name, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,2)}}

      - name: 打包二进制
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
