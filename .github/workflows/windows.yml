name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive

      - name: 记录实际编译的 commit
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "BUILT_SHA=$(git rev-parse HEAD)"

      - name: 安装 vcpkg 并编译依赖
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/vcpkg
          cd ${{github.workspace}}/vcpkg
          git checkout efcfaaf60d7ec57a159fc3110403d939bfb69729
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install openssl libsrtp[openssl] usrsctp --triplet x64-windows-static

      - name: CMake 配置
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译 MediaServer
        shell: pwsh
        run: |
          if (-not (Test-Path build/server/MediaServer.vcxproj)) {
            Get-ChildItem -Path build -Recurse -Filter *.vcxproj | Select-Object FullName
            throw "未找到 build/server/MediaServer.vcxproj"
          }
          cmake --build build --config Release --target MediaServer --parallel 4

      - name: 全工作区收集产物（exe + config + pem + www）
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1) 主程序
          $exe = Get-ChildItem -Path $ws -Recurse -Filter "MediaServer.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "整个工作区未找到 MediaServer.exe" }
          foreach ($f in @($exe)) { Copy-Item $f.FullName -Destination dist -Force; Write-Host "收集: $($f.FullName)" }

          # 2) 配置文件
          @("server/config.ini", "conf/config.ini", "config.ini") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ -Destination dist/config.ini -Force; Write-Host "收集配置: $_" }
          }

          # 3) default.pem：优先仓库自带，否则用 openssl 生成自签名证书
          $pem = Get-ChildItem -Path $ws -Recurse -Filter "default.pem" -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\vcpkg\\' } | Select-Object -First 1
          if ($pem) {
            Copy-Item $pem.FullName -Destination dist/default.pem -Force
            Write-Host "收集证书: $($pem.FullName)"
          } else {
            Write-Host "仓库未自带 default.pem，尝试生成自签名证书..."
            $opensslExe = (Get-Command openssl -ErrorAction SilentlyContinue).Source
            if (-not $opensslExe) {
              $opensslExe = Get-ChildItem -Path "$ws/vcpkg/installed" -Recurse -Filter "openssl.exe" -ErrorAction SilentlyContinue |
                            Select-Object -First 1 -ExpandProperty FullName
            }
            if ($opensslExe) {
              & $opensslExe req -x509 -newkey rsa:2048 -keyout "$ws/key.pem" -out "$ws/cert.pem" -days 3650 -nodes -subj "/CN=localhost"
              Get-Content "$ws/cert.pem", "$ws/key.pem" | Set-Content dist/default.pem
              Write-Host "已生成自签名 default.pem"
            } else {
              Write-Host "⚠ 未找到 openssl 工具，跳过证书生成（仅影响 https 端口）"
            }
          }

          # 4) www 目录（旧版可能叫 web）
          $www = Get-ChildItem -Path $ws -Recurse -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -in @('www','web') -and $_.FullName -notmatch '\\vcpkg\\|\\build\\|\\.git\\' } |
                 Select-Object -First 1
          if ($www) {
            Copy-Item $www.FullName -Destination dist/www -Recurse -Force
            Write-Host "收集网页目录: $($www.FullName)"
          } else {
            Write-Host "⚠ 仓库中未发现 www/web 目录（不影响核心功能）"
          }

          Write-Host "=== dist 最终内容 ==="
          Get-ChildItem dist | Select-Object Name

      - name: 打包 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          if (-not (Get-ChildItem -Path dist -Recurse -File -ErrorAction SilentlyContinue)) {
            Write-Host "⚠ dist 为空，写入占位文件以绕过 Artifact 上传缺陷"
            Set-Content -Path dist/_EMPTY_BUILD_PLACEHOLDER.txt -Value "No binary artifacts were produced in this build."
          }
          Compress-Archive -Path dist\* -DestinationPath upload\ZLMediaKit-Windows-x64.zip
          Get-ChildItem upload | Select-Object Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,2)}}

      # ✅ 终极方案：PAT + curl 直接调 REST API
      #    前提：已在 GitHub 网页上手动创建过一次 Release 以激活 Fork 仓库的 Releases 功能
      - name: 发布到 Releases（独立 Release，保留历史）
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUILT_SHA: ${{ env.BUILT_SHA }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = "win-$env:RUN_NUMBER"
          $title = "ZLMediaKit Windows x64 #$env:RUN_NUMBER"
          $body = "Windows x64 静态构建（历史版本全部保留，可回滚）。`n实际编译 commit: $env:BUILT_SHA`n包内含: MediaServer.exe / config.ini / default.pem / www(如有)"

          # 1) 创建 Release
          $releaseBody = @{
            tag_name         = $tag
            target_commitish = $env:BUILT_SHA
            name             = $title
            body             = $body
            draft            = $false
            prerelease       = $false
          } | ConvertTo-Json

          $headers = @{
            Authorization = "token $env:RELEASE_TOKEN"
            Accept        = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          Write-Host "正在创建 Release: $tag ..."
          try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:REPO/releases" `
              -Method Post `
              -Headers $headers `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($releaseBody)) `
              -ContentType "application/json; charset=utf-8"
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            $errorBody = ""
            if ($_.Exception.Response) {
              $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
              $errorBody = $reader.ReadToEnd()
            }
            Write-Host "❌ 创建 Release 失败 (HTTP $statusCode): $errorBody"
            throw "Release 创建失败，请确认：1) RELEASE_TOKEN Secret 已设置且未过期 2) 已在网页上手动创建过一次 Release 激活功能"
          }

          $uploadUrl = $response.upload_url -replace '\{.*\}', ''
          Write-Host "✅ Release 创建成功: $($response.html_url)"

          # 2) 上传附件
          $filePath = "upload/ZLMediaKit-Windows-x64.zip"
          $fileName = "ZLMediaKit-Windows-x64.zip"
          $fileBytes = [System.IO.File]::ReadAllBytes($filePath)

          Write-Host "正在上传附件: $fileName ($([math]::Round($fileBytes.Length/1MB,2)) MB) ..."
          try {
            $uploadResponse = Invoke-RestMethod -Uri "$uploadUrl`?name=$fileName" `
              -Method Post `
              -Headers @{
                Authorization = "token $env:RELEASE_TOKEN"
                Accept        = "application/vnd.github+json"
                "Content-Type" = "application/octet-stream"
              } `
              -Body $fileBytes
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            $errorBody = ""
            if ($_.Exception.Response) {
              $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
              $errorBody = $reader.ReadToEnd()
            }
            Write-Host "❌ 上传附件失败 (HTTP $statusCode): $errorBody"
            throw "附件上传失败"
          }

          Write-Host "✅ 附件上传成功: $($uploadResponse.browser_download_url)"

      - name: 上传 Artifact 备份
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Windows_${{ github.ref_name }}_${{ github.sha }}
          path: |
            dist/**/*
            dist/*
          if-no-files-found: warn
          retention-days: 90
