name: Windows Build ZLMediaKit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: false

      - name: 拉取子模块
        run: git submodule sync && git submodule update --init --depth=1

      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: '390c240f54d0e02c6490e86c42f4d40d449c47d7'
          # 关键修复：使用vcpkgArguments，移除非法vcpkgJsonGlob
          vcpkgArguments: >
            openssl:x64-windows-static
            libsrtp:x64-windows-static
            usrsctp:x64-windows-static
            ffmpeg:x64-windows-static

      - name: CMake编译
        uses: lukka/run-cmake@v3
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/CMakeLists.txt
          buildDirectory: ${{ github.workspace }}/build
          cmakeAppendedArgs: >
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
            -DENABLE_WEBRTC=OFF
          buildWithCMake: true

      - name: 设置日期环境变量
        run: |
          $dateString = Get-Date -Format "yyyy-MM-dd"
          echo "BUILD_DATE=$dateString" >> $env:GITHUB_ENV

      - name: 检索编译产物
        run: Get-ChildItem ./build -Recurse -Include *.exe

      - name: 打包二进制
        uses: actions/upload-artifact@v4
        with:
          name: ZLMediaKit-Win-x64-${{ env.BUILD_DATE }}
          path: |
            build/*.exe
            build/*.dll
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: error
