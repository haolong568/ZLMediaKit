name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive
          fetch-depth: 0

      - name: 记录实际编译的 commit
        run: echo "BUILT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 安装系统依赖（全功能）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libssl-dev \
            libsrtp2-dev \
            libsctp-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            ffmpeg \
            zlib1g-dev

      - name: CMake 配置（全功能开启）
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WEBRTC=ON \
            -DENABLE_SRT=ON \
            -DENABLE_RTPPROXY=ON \
            -DENABLE_HLS=ON \
            -DENABLE_MP4=ON \
            -DENABLE_API=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_FAAC=OFF \
            -DENABLE_X264=OFF \
            -DENABLE_FFMPEG=ON

      - name: 编译 MediaServer
        run: cmake --build build --config Release --target MediaServer --parallel $(nproc)

      - name: 收集产物（二进制 + config + pem + www）
        run: |
          mkdir -p dist

          # 1) 主程序
          EXE=$(find . -name "MediaServer" -type f -executable ! -path "*/vcpkg/*" ! -path "*/.git/*" | head -1)
          if [ -z "$EXE" ]; then
            echo "❌ 未找到 MediaServer 可执行文件"
            find . -name "MediaServer*" -type f | head -20
            exit 1
          fi
          cp "$EXE" dist/MediaServer
          chmod +x dist/MediaServer
          echo "收集: $EXE"

          # 2) 配置文件
          for f in server/config.ini conf/config.ini config.ini; do
            if [ -f "$f" ]; then
              cp "$f" dist/config.ini
              echo "收集配置: $f"
              break
            fi
          done

          # 3) default.pem
          PEM=$(find . -name "default.pem" -type f ! -path "*/vcpkg/*" ! -path "*/.git/*" | head -1)
          if [ -n "$PEM" ]; then
            cp "$PEM" dist/default.pem
            echo "收集证书: $PEM"
          else
            echo "仓库未自带 default.pem，生成自签名证书..."
            openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes -subj "/CN=localhost"
            cat cert.pem key.pem > dist/default.pem
            echo "已生成自签名 default.pem"
          fi

          # 4) www 目录
          WWW_DIR=$(find . -maxdepth 3 -type d \( -name "www" -o -name "web" \) ! -path "*/vcpkg/*" ! -path "*/build/*" ! -path "*/.git/*" | head -1)
          if [ -n "$WWW_DIR" ]; then
            cp -r "$WWW_DIR" dist/www
            echo "收集网页目录: $WWW_DIR"
          else
            echo "⚠ 仓库中未发现 www/web 目录"
          fi

          echo "=== dist 最终内容 ==="
          ls -lh dist/

      - name: 打包 tar.gz
        run: |
          mkdir -p upload
          if [ ! "$(ls -A dist/)" ]; then
            echo "No binary artifacts." > dist/_EMPTY_BUILD_PLACEHOLDER.txt
          fi
          tar -czf upload/ZLMediaKit-Linux-x64.tar.gz -C dist .
          ls -lh upload/

      - name: 发布到 Releases（独立 Release，保留历史）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUILT_SHA: ${{ env.BUILT_SHA }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          TAG="linux-$RUN_NUMBER"
          TITLE="ZLMediaKit Linux x64 #$RUN_NUMBER (全功能)"
          BODY="Linux x64 构建（全功能：WebRTC/SRT/HLS/RTSP/RTMP/HTTP-FLV/GB28181/FFmpeg转码）。
          对应 commit: $BUILT_SHA
          包内含: MediaServer / config.ini / default.pem / www(如有)
          运行方式: chmod +x MediaServer && ./MediaServer -c config.ini"
          ASSET="upload/ZLMediaKit-Linux-x64.tar.gz"

          echo "✨ 创建 Release: $TAG ..."
          gh release create "$TAG" "$ASSET" --title "$TITLE" --notes "$BODY" --latest
          echo "✅ Release 发布成功: $TAG → commit $BUILT_SHA"

      - name: 上传 Artifact 备份
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Linux_${{ github.ref_name }}_${{ github.sha }}
          path: |
            dist/**/*
            dist/*
          if-no-files-found: warn
          retention-days: 90
