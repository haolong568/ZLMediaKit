name: Linux

on:
  push:
    branches: ['**']       # ✅ 仅监听分支push，tag push不触发（防循环核心）
    tags-ignore: ['**']    # ✅ 显式忽略所有tag，彻底切断tag→workflow链路
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ↓↓↓ checkout 与原版完全一致，一字未动 ↓↓↓
      - uses: actions/checkout@v4
        with:
          ref: 79d795a767da85bbba821b871265fd87d853d808
          submodules: recursive
          fetch-depth: 0

      - name: 记录实际编译的 commit
        run: echo "BUILT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libssl-dev libsctp-dev

      - name: 安装 vcpkg 并编译依赖（全功能：openssl + srtp + usrsctp）
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/vcpkg
          cd ${{github.workspace}}/vcpkg
          git checkout efcfaaf60d7ec57a159fc3110403d939bfb69729
          ./bootstrap-vcpkg.sh
          ./vcpkg install openssl libsrtp[openssl] usrsctp --triplet x64-linux

      - name: CMake 配置（全功能开启）
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WEBRTC=ON \
            -DENABLE_SRT=ON \
            -DENABLE_RTPPROXY=ON \
            -DENABLE_HLS=ON \
            -DENABLE_MP4=ON \
            -DENABLE_API=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_FAAC=OFF \
            -DENABLE_X264=OFF \
            -DENABLE_FFMPEG=OFF

      - name: 编译 MediaServer
        run: |
          if [ ! -f build/server/MediaServer ]; then
            echo "=== 查找可执行文件 ==="
            find build -name "MediaServer" -type f 2>/dev/null || true
            # 先尝试 make，如果 vcxproj 不存在是正常的（Linux 用 Makefile/Ninja）
          fi
          cmake --build build --config Release --target MediaServer --parallel $(nproc)

      - name: 全工作区收集产物（可执行文件 + config + pem + www）
        run: |
          ws=$GITHUB_WORKSPACE
          mkdir -p dist

          # 收集可执行文件
          exe=$(find "$ws" -name "MediaServer" -type f -not -path "*/vcpkg/*" -not -path "*/.git/*" 2>/dev/null | head -1)
          if [ -z "$exe" ]; then
            echo "❌ 整个工作区未找到 MediaServer 可执行文件"
            find "$ws/build" -type f -executable 2>/dev/null | head -20
            exit 1
          fi
          cp "$exe" dist/MediaServer
          chmod +x dist/MediaServer
          echo "收集: $exe"

          # 收集配置文件
          for cfg in "server/config.ini" "conf/config.ini" "config.ini"; do
            if [ -f "$cfg" ]; then
              cp "$cfg" dist/config.ini
              echo "收集配置: $cfg"
              break
            fi
          done

          # 收集证书
          pem=$(find "$ws" -name "default.pem" -not -path "*/vcpkg/*" -not -path "*/.git/*" 2>/dev/null | head -1)
          if [ -n "$pem" ]; then
            cp "$pem" dist/default.pem
            echo "收集证书: $pem"
          else
            echo "仓库未自带 default.pem，尝试生成自签名证书..."
            openssl_exe=$(which openssl 2>/dev/null)
            if [ -z "$openssl_exe" ]; then
              openssl_exe=$(find "$ws/vcpkg/installed" -name "openssl" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$openssl_exe" ]; then
              $openssl_exe req -x509 -newkey rsa:2048 -keyout "$ws/key.pem" -out "$ws/cert.pem" -days 3650 -nodes -subj "/CN=localhost"
              cat "$ws/cert.pem" "$ws/key.pem" > dist/default.pem
              echo "已生成自签名 default.pem"
            else
              echo "⚠ 未找到 openssl 工具，跳过证书生成"
            fi
          fi

          # 收集网页目录
          www=$(find "$ws" -maxdepth 3 -type d \( -name "www" -o -name "web" \) -not -path "*/vcpkg/*" -not -path "*/build/*" -not -path "*/.git/*" 2>/dev/null | head -1)
          if [ -n "$www" ]; then
            cp -r "$www" dist/www
            echo "收集网页目录: $www"
          else
            echo "⚠ 仓库中未发现 www/web 目录"
          fi

          echo "=== dist 最终内容 ==="
          ls -la dist/

      - name: 打包 tar.gz
        run: |
          mkdir -p upload
          if [ ! "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "No binary artifacts." > dist/_EMPTY_BUILD_PLACEHOLDER.txt
          fi
          tar -czvf upload/ZLMediaKit-Linux-x64.tar.gz -C dist .
          ls -lh upload/

      - name: 发布到 Releases（独立 Release，保留历史）
        # ✅ 双重保险：仅分支push才发布，tag push绝不进入此步骤
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUILT_SHA: ${{ env.BUILT_SHA }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          tag="linux-$RUN_NUMBER"
          title="ZLMediaKit Linux x64 #$RUN_NUMBER (全功能)"
          body="Linux x64 静态构建（全功能：WebRTC/SRT/HLS/RTSP/RTMP/HTTP-FLV/GB28181）。
          对应 commit: $BUILT_SHA
          包内含: MediaServer / config.ini / default.pem / www(如有)"
          asset="upload/ZLMediaKit-Linux-x64.tar.gz"

          echo "✨ 创建 Release: $tag ..."
          gh release create "$tag" "$asset" --title "$title" --notes "$body" --latest
          if [ $? -ne 0 ]; then
            echo "❌ 创建 Release 失败"
            exit 1
          fi

          echo "✅ Release 发布成功: $tag → commit $BUILT_SHA"

      - name: 上传 Artifact 备份
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Linux_${{ github.ref_name }}_${{ github.sha }}
          path: |
            dist/**/*
            dist/*
          if-no-files-found: warn
          retention-days: 90
